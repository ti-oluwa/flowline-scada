[project]
name = "flowline-scada"
version = "2.0.0.dev0"
description = "Multiphase pipeline network simulator with a P&ID-driven desktop interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=25.3.0",
    "cattrs>=25.2.0",
    "coolprop>=7.0.0",
    "networkx>=3.4.0",
    "pint>=0.25",
    "pyside6>=6.8.0",
    "thermo>=0.4.2",
]

# PEP 735 dependency groups, not [project.optional-dependencies] — neither
# of these is a runtime feature an end user installing the shipped app
# would ever opt into (that's what optional-dependencies/"extras" are
# for); both are purely development-time tooling, which is exactly what
# dependency-groups exists to express. Install with `pip install -e .
# --group dev` (pip >= 25.1) or the equivalent in uv/hatch.
[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pyinstaller>=6.16.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "pytest-xvfb>=3.0.0",
    "ruff>=0.8.0",
    "scipy>=1.14.0",
    # networkx itself doesn't ship inline type hints (no py.typed
    # marker) — this is the actively-maintained typeshed-style stub
    # package for it, checked against the pinned networkx version above.
    "types-networkx>=3.4.0",
]
# Development-time correctness oracle for the multiphase correlations
# (arrives in Phase 2) — cross-checks our own Beggs & Brill / Mukherjee &
# Brill implementations against NeqSim's. Requires a JVM (NeqSim is a Java
# library with a Python bridge). Never a runtime dependency of the shipped
# app, never installed by the default dev setup — only pulled in with
# `--group validate` for the dedicated validation test run.
validate = [
    "neqsim>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowline_scada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade — modern syntax
    "B",   # bugbear — common correctness pitfalls
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.mypy]
# NOTE: kept at 3.12 for the same reason noted below on the numpy
# override — this project's own code targets 3.11 (see [project]
# requires-python) and doesn't use any 3.12-only syntax, so this doesn't
# weaken what's actually checked; 3.11 runtime compatibility is enforced
# by the CI matrix running the full test suite under both interpreters.
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# thermo doesn't ship a py.typed marker or stub package, so mypy can't
# resolve its types at all — this is a library-typing gap, not something
# fixable on our end. Silencing the missing-stubs warning specifically
# (not disabling checking of code that *uses* thermo) is the appropriate
# scope here.
module = "thermo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy is a test-only dependency here (cross-checking correlations
# against scipy.optimize.brentq as a ground truth), not a runtime one —
# not worth adding a full scipy-stubs dependency for test-only usage.
module = "scipy.*"
ignore_missing_imports = true
